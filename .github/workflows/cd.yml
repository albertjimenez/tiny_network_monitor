name: cd

# Continuous delivery. Runs only on `v*` tags:
#   1. re-runs the test gate (a tag must never ship red code),
#   2. builds + publishes release binaries to the GitHub release,
#   3. builds + pushes multi-arch images to Docker Hub (beruto/netmon).
#
# Binary targets:
#   x86_64-unknown-linux-musl  fully static 64-bit Linux
#   arm-unknown-linux-musleabihf fully static 32-bit ARM (old Pi / routers),
#     built with cargo-zigbuild (Zig provides the musl cross toolchain)
#   x86_64-pc-windows-gnu      64-bit Windows, cross-compiled on Linux with
#     mingw-w64; RUSTFLAGS links the mingw runtime statically so the .exe
#     has no extra DLL dependencies
#   aarch64-apple-darwin        Apple Silicon, native runner
# Docker stays amd64+arm64: 64-bit covers every supported Pi OS install,
# while arm/v6 are served by the armv6 binary.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release-binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cargo
            apt_pkgs: musl-tools
            rustflags: ""
            archive: targz
            exe: ""
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            builder: zigbuild
            apt_pkgs: ""
            rustflags: ""
            archive: targz
            exe: ""
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            builder: cargo
            apt_pkgs: mingw-w64
            rustflags: "-C link-arg=-static"
            archive: zip
            exe: .exe
          - os: macos-14 # Apple Silicon runner
            target: aarch64-apple-darwin
            builder: cargo
            apt_pkgs: ""
            rustflags: ""
            archive: targz
            exe: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross toolchain (Linux)
        if: matrix.apt_pkgs != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkgs }}
      - uses: mlugg/setup-zig@v2
        if: matrix.builder == 'zigbuild'
        with:
          version: 0.15.1
      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        run: cargo install cargo-zigbuild --version 0.23.4 --locked
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [ "${{ matrix.builder }}" = "zigbuild" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: List Windows DLL imports (must be system DLLs only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: x86_64-w64-mingw32-objdump -p "target/${{ matrix.target }}/release/network_monitor${{ matrix.exe }}" | grep "DLL Name"
      - name: Package
        shell: bash
        run: |
          STAGE=dist/netmon
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/network_monitor${{ matrix.exe }}" "$STAGE/"
          cp config.json README.md "$STAGE/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "../netmon-${{ matrix.target }}.zip" netmon)
          else
            tar -czf "netmon-${{ matrix.target }}.tar.gz" -C dist netmon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: netmon-${{ matrix.target }}
          path: netmon-${{ matrix.target }}.*

  publish-release:
    needs: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            netmon-*.tar.gz
            netmon-*.zip
          generate_release_notes: true

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: beruto
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            beruto/netmon:${{ github.ref_name }}
            beruto/netmon:latest
