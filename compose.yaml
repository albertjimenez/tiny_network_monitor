name: netmon

services:
  netmon:
    build: .
    image: netmon:latest
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_PATH: /data/netmon.db
      CONFIG_PATH: /config.json
      CHECK_INTERVAL_SECS: "10"
      CHECK_TIMEOUT_SECS: "5"
      # Optional: override the baked-in targets.
      # TARGETS: "Google DNS=8.8.8.8:53,Cloudflare=1.1.1.1:53,Google HTTPS=google.com:443"
    volumes:
      - netmon-data:/data
    restart: unless-stopped
    # The scratch image has no shell/curl, so the binary checks itself via
    # `netmon healthcheck` (GETs /api/health on $PORT, exit 0 = healthy).
    healthcheck:
      test: ["CMD", "/network_packet_drop", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  netmon-data:
